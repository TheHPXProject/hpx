name: Linux (Debug, all tests)

on:
  pull_request:
  push:
    branches:
      - master
      - 'release**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Clang
    uses: ./.github/workflows/sharded-build-and-test.yml
    with:
      container: stellargroup/build_env:19
      base-targets: hpx_core core components
      shards: 25
      # UCX for the UCX device conduit; the tests run with it, and the TCP
      # parcelport sends large host chunks through it. The image (Ubuntu 20.04)
      # has UCX 1.8 without headers (for Open MPI), older than the conduit needs:
      # unpack a UCX release into its own prefix and load it from there.
      setup: |
        ucx_version=1.23.0
        ucx_package=ucx-${ucx_version}-ubuntu20.04-mofed5-cuda12-x86_64.tar.bz2
        mkdir -p /tmp/ucx && cd /tmp/ucx
        curl -fsSL -o ucx.tar.bz2 \
          "https://github.com/openucx/ucx/releases/download/v${ucx_version}/${ucx_package}"
        echo "deaee327d804b2c846f503b3457a33c66e105d31a49a199e2d53009a7ebbcc93  ucx.tar.bz2" | \
          sha256sum --check --status
        tar -xjf ucx.tar.bz2
        dpkg -x ucx-${ucx_version}.deb root
        rm -rf /opt/ucx && mv root/usr /opt/ucx
        sed -i 's|^prefix *=.*|prefix = /opt/ucx|' /opt/ucx/lib/pkgconfig/*.pc
        cd / && rm -rf /tmp/ucx
        echo "UCX_ROOT=/opt/ucx" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/opt/ucx/lib" >> "$GITHUB_ENV"
        echo "HPX_PARCEL_DEVICE_CONDUIT=ucx" >> "$GITHUB_ENV"
        echo "HPX_PARCEL_CONDUIT_HOST_CHUNKS=1" >> "$GITHUB_ENV"
        echo "HPX_PARCEL_CONDUIT_HOST_THRESHOLD=8192" >> "$GITHUB_ENV"
      configure: |
        mkdir -p "$GITHUB_WORKSPACE/build"
        cd "$GITHUB_WORKSPACE/build"

        cmake --version
        if [ "${{ github.event_name }}" != "pull_request" ] && \
          { [ "${{ github.ref_name }}" == "master" ] || \
            [[ "${{ github.ref_name }}" =~ ^release.* ]] || \
            [ "${{ github.ref_type }}" == "tag" ]; }; then
          DOCUMENTATION_OUTPUT_FORMATS="html;singlehtml;latexpdf"
        else
          DOCUMENTATION_OUTPUT_FORMATS="html"
        fi

        cmake \
          "$GITHUB_WORKSPACE" \
          -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DHPX_WITH_MALLOC=system \
          -DHPX_WITH_FETCH_ASIO=Off \
          -DHPX_WITH_GIT_COMMIT=${{ github.sha }} \
          -DHPX_WITH_GIT_BRANCH="${{ github.ref_name }}" \
          -DHPX_WITH_GIT_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}" \
          -DHPX_WITH_TOOLS=On \
          -DCMAKE_CXX_FLAGS="-fcolor-diagnostics" \
          -DHPX_WITH_TESTS_HEADERS=On \
          -DHPX_WITH_TESTS_BENCHMARKS=ON \
          -DHPX_WITH_TESTS_RUN_BENCHMARKS=ON \
          -DHPX_WITH_COMPILER_WARNINGS=On \
          -DHPX_WITH_COMPILER_WARNINGS_AS_ERRORS=On \
          -DHPX_WITH_DEPRECATION_WARNINGS=On \
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy-21 \
          -DHPX_WITH_THREAD_LOCAL_STORAGE=On \
          -DHPX_WITH_STACKTRACES_STATIC_SYMBOLS=On \
          -DHPX_WITH_STACKTRACES_DEMANGLE_SYMBOLS=Off \
          -DHPX_WITH_SPINLOCK_DEADLOCK_DETECTION=On \
          -DHPX_WITH_CHECK_MODULE_DEPENDENCIES=On \
          -DHPX_LOGGING_WITH_SEPARATE_DESTINATIONS=Off \
          -DHPX_WITH_THREAD_DEBUG_INFO=On \
          -DHPX_COMMAND_LINE_HANDLING_WITH_JSON_CONFIGURATION_FILES=On \
          -DHPX_WITH_FETCH_JSON=On \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=On \
          -DHPX_WITH_DOCUMENTATION=On \
          -DHPX_WITH_DOCUMENTATION_OUTPUT_FORMATS="${DOCUMENTATION_OUTPUT_FORMATS}" \
          -DHPX_WITH_TESTS_COMMAND_LINE=--hpx:queuing=local-workrequesting-fifo \
          -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=2 \
          -DHPX_WITH_SUPERVISION=On \
          -DHPX_WITH_DATAPAR=On \
          -DHPX_WITH_DATAPAR_BACKEND=EMULATE \
          -DHPX_WITH_DEVICE_CONDUIT_UCX=On

          # Disable logging for now as otherwise we run out of diskspace on the
          # github runner instance
          # -DHPX_WITH_TESTS_DEBUG_LOG=On 
          # -DHPX_WITH_TESTS_DEBUG_LOG_DESTINATION="$GITHUB_WORKSPACE/build/debug-log.txt"
