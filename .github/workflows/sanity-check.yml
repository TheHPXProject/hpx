name: DCO
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commits_check_job:
    runs-on: ubuntu-latest
    name: Commits Check
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/ci-scripts

    # The commits are read here instead of being passed to an action as an
    # input: an input is an environment variable, limited to 128 KB, which the
    # commits of a large pull request exceed
    - name: DCO Check
      # bash runs with pipefail, a failure to get the commits fails the check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        failed=$(gh api --paginate "repos/${REPO}/pulls/${PR}/commits" |
          jq -s 'add' | jq -r -f .github/ci-scripts/dco.jq)
        if [ -n "${failed}" ]; then
          echo "::error::The DCO check failed"
          echo "${failed}"
          echo "All commits need a 'Signed-off-by: Name <email>' line naming"
          echo "their author, for instance by committing with 'git commit -s'."
          exit 1
        fi
        echo "All commits are signed off."
