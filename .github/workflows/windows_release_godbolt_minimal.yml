name: Windows CI (Release, Godbolt Minimal)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - uses: lukka/get-cmake@v4.4.2

    - name: Install dependencies
      run: |
        md C:\projects
        $archive = "C:\projects\vcpkg-export-hpx-dependencies.7z"
        $expected = "1781883DA9EC4C51406EDA9B5B114AADB6185DAD2A7AB3955AC1D019C99F6777"
        $client = new-object System.Net.WebClient
        $client.DownloadFile("https://rostam.cct.lsu.edu/download/builder/vcpkg-export-hpx-dependencies-2026.7z", $archive)
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
        if ($actual -ne $expected) {
          throw "vcpkg archive SHA-256 mismatch: expected $expected, got $actual"
        }
        7z x $archive -y -oC:\projects\vcpkg
    - name: Configure
      shell: bash
      run: |
          cmake . -Bbuild -G'Visual Studio 17 2022' \
              -DCMAKE_TOOLCHAIN_FILE='C:/projects/vcpkg/scripts/buildsystems/vcpkg.cmake' \
              -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
              -DHPX_WITH_CXX_STANDARD=20 \
              -DHPX_WITH_STATIC_LINKING=ON \
              -DHPX_WITH_DISTRIBUTED_RUNTIME=OFF \
              -DHPX_WITH_NETWORKING=OFF \
              -DHPX_WITH_FETCH_ASIO=ON \
              -DHPX_WITH_FETCH_HWLOC=ON \
              -DHPX_WITH_MALLOC=system \
              -DHPX_WITH_TESTS=OFF \
              -DHPX_WITH_EXAMPLES=OFF \
              -DHPX_WITH_DOCUMENTATION=OFF \
              -DHPX_WITH_TOOLS=OFF
    - name: Build
      shell: bash
      run: |
          cmake --build build --config Release \
          --target ALL_BUILD \
          -- -maxcpucount:2 -verbosity:minimal -nologo
    - name: Install
      shell: bash
      run: |
        cmake --install build --config Release \
          --prefix "$PWD/build/install"
        test -f "$PWD/build/install/include/hpx/experimental/sandbox.hpp"
        test -f "$PWD/build/install/lib/hpx_wrap.lib"
        test -f "$PWD/build/install/lib/hpx_init.lib"
        test -f "$PWD/build/install/lib/hpx.lib"
        test -f "$PWD/build/install/lib/hpx_core.lib"
    - name: Build and run CMake smoke test
      shell: bash
      run: |
        mkdir -p build/smoke
        cat > build/smoke/CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.18)
        project(hpx_godbolt_minimal_smoketest CXX)

        find_package(HPX REQUIRED)

        add_executable(hello_world hello_world.cpp)
        target_link_libraries(hello_world PRIVATE HPX::hpx)

        add_executable(hello_wrap hello_wrap.cpp)
        target_link_libraries(hello_wrap PRIVATE HPX::hpx HPX::wrap_main)
        EOF

        cat > build/smoke/hello_world.cpp << 'EOF'
        #include <hpx/init.hpp>

        #include <iostream>

        int hpx_main(int, char*[])
        {
          std::cout << "Hello World!\n";
          return hpx::local::finalize();
        }

        int main(int argc, char* argv[])
        {
          return hpx::local::init(&hpx_main, argc, argv);
        }
        EOF

        cat > build/smoke/hello_wrap.cpp << 'EOF'
        #include <hpx/hpx_main.hpp>
        #include <hpx/experimental/sandbox.hpp>

        #include <iostream>

        int main()
        {
          hpx::experimental::sandbox::describe_environment(std::cout);
          std::cout << "Hello wrap-main\n";
          return 0;
        }
        EOF

        cmake \
          -Sbuild/smoke \
          -Bbuild/smoke/build \
          -G'Visual Studio 17 2022' \
          -DCMAKE_PREFIX_PATH="$PWD/build/install" \
          -DCMAKE_TOOLCHAIN_FILE='C:/projects/vcpkg/scripts/buildsystems/vcpkg.cmake'

        cmake --build build/smoke/build --config Release \
          -- -maxcpucount:2 -verbosity:minimal -nologo

        # Fetched hwloc is a DLL. Windows will not start the smoke binaries
        # unless that DLL is on PATH or sits next to the .exe. Git bash
        # reports a missing DLL as exit 127.
        SMOKE_DIR=build/smoke/build/Release
        for dll_dir in \
            "$PWD/build/install/bin" \
            "$PWD/build/install/hwloc_installed/bin" \
            "$PWD/build/_deps/hwloc-src/bin"
        do
          if [ -d "$dll_dir" ]; then
            cp -f "$dll_dir"/*.dll "$SMOKE_DIR/" 2>/dev/null || true
            export PATH="$dll_dir:$PATH"
          fi
        done

        "./$SMOKE_DIR/hello_world.exe"
        "./$SMOKE_DIR/hello_wrap.exe" --hpx:threads=2
