name: Linux (Release, C++20 Modules)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Clang
    uses: ./.github/workflows/sharded-build-and-test.yml
    with:
      container: stellargroup/build_env:23
      configure: |
        cmake \
            . \
            -Bbuild \
            -GNinja \
            -DHPX_WITH_CXX_STANDARD=23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHPX_WITH_MALLOC=system \
            -DHPX_WITH_FETCH_ASIO=ON \
            -DHPX_WITH_ASIO_TAG=asio-1-34-2 \
            -DHPX_WITH_EXAMPLES=ON \
            -DHPX_WITH_TESTS=ON \
            -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=2 \
            -DHPX_WITH_SUPERVISION=ON \
            -DHPX_WITH_VERIFY_LOCKS=ON \
            -DHPX_WITH_VERIFY_LOCKS_BACKTRACE=ON \
            -DHPX_WITH_CHECK_MODULE_DEPENDENCIES=ON \
            -DHPX_WITH_CXX_MODULES=ON \
            -DHPX_WITH_DATAPAR=ON \
            -DHPX_WITH_DATAPAR_BACKEND=EMULATE
      base-targets: hpx_core core components
      shards: 25
