name: Linux CI (Release, Godbolt Minimal)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: stellargroup/build_env:17

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      shell: bash
      run: cmake --preset godbolt-minimal
    - name: Build
      shell: bash
      run: cmake --build --preset godbolt-minimal
    - name: Install
      shell: bash
      run: |
        cmake --install build/godbolt-minimal --prefix "$PWD/build/install"
        test -f "$PWD/build/install/include/hpx/experimental/sandbox.hpp"
        test -f "$PWD/build/install/lib/libhpx_wrap.a"
        test -f "$PWD/build/install/lib/libhpx_init.a"
        test -f "$PWD/build/install/lib/libhpx.a"
        test -f "$PWD/build/install/lib/libhpx_core.a"
    - name: Build and run CMake smoke test
      shell: bash
      run: |
        .github/ci-scripts/godbolt_minimal_smoke/run_cmake_smoke.sh \
          --prefix "$PWD/build/install" \
          --build-dir build/smoke/build
    - name: Raw g++ wrap-main smoke test
      shell: bash
      run: |
        .github/ci-scripts/godbolt_minimal_smoke/run_raw_gxx_smoke.sh \
          --prefix "$PWD/build/install" \
          --cmake-build-dir build/smoke/build \
          --out-dir build/smoke
