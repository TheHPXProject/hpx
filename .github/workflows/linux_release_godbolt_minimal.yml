name: Linux CI (Release, Godbolt Minimal)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: stellargroup/build_env:17

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      shell: bash
      run: |
          cmake --preset godbolt-minimal
    - name: Build
      shell: bash
      run: |
          cmake --build --preset godbolt-minimal
    - name: Install
      shell: bash
      run: |
        cmake --install build/godbolt-minimal --prefix "$PWD/build/install"
        test -f "$PWD/build/install/include/hpx/experimental/sandbox.hpp"
        test -f "$PWD/build/install/lib/libhpx_wrap.a"
        test -f "$PWD/build/install/lib/libhpx_init.a"
        test -f "$PWD/build/install/lib/libhpx.a"
        test -f "$PWD/build/install/lib/libhpx_core.a"
    - name: Build and run CMake smoke test
      shell: bash
      run: |
        mkdir -p build/smoke
        cat > build/smoke/CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.18)
        project(hpx_godbolt_minimal_smoketest CXX)

        find_package(HPX REQUIRED)

        add_executable(hello_world hello_world.cpp)
        target_link_libraries(hello_world PRIVATE HPX::hpx)

        add_executable(hello_wrap hello_wrap.cpp)
        target_link_libraries(hello_wrap PRIVATE HPX::hpx HPX::wrap_main)
        EOF

        cat > build/smoke/hello_world.cpp << 'EOF'
        #include <hpx/init.hpp>

        #include <iostream>

        int hpx_main(int, char*[])
        {
          std::cout << "Hello World!\n";
          return hpx::local::finalize();
        }

        int main(int argc, char* argv[])
        {
          return hpx::local::init(&hpx_main, argc, argv);
        }
        EOF

        cat > build/smoke/hello_wrap.cpp << 'EOF'
        #include <hpx/hpx_main.hpp>
        #include <hpx/experimental/sandbox.hpp>

        #include <iostream>

        int main()
        {
          hpx::experimental::sandbox::describe_environment(std::cout);
          std::cout << "Hello wrap-main\n";
          return 0;
        }
        EOF

        cmake \
          -Sbuild/smoke \
          -Bbuild/smoke/build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$PWD/build/install"

        cmake --build build/smoke/build
        build/smoke/build/hello_world
        build/smoke/build/hello_wrap --hpx:threads=2
    - name: Raw g++ wrap-main smoke test
      shell: bash
      run: |
        PREFIX="$PWD/build/install"
        cat > build/smoke/raw_wrap.cpp << 'EOF'
        #include <hpx/hpx_main.hpp>
        #include <hpx/experimental/sandbox.hpp>

        #include <iostream>

        int main()
        {
          hpx::experimental::sandbox::describe_environment(std::cout);
          std::cout << "Hello raw g++\n";
          return 0;
        }
        EOF

        # Compiler Explorer invokes the compiler directly. Reuse the CMake
        # compiler and -std= flag: default `g++` in build_env:17 is too old
        # for -std=c++20 (it only accepts -std=c++2a).
        #
        # HPX static builds install one archive per module
        # (libhpx_include_local.a, libhpx_logging.a, ...). Those objects are
        # not merged into libhpx_core.a, so -lhpx_wrap -lhpx_init -lhpx
        # -lhpx_core is not enough. Reuse the archives and linker flags
        # CMake already used for hello_wrap (full-path .a/.so, Boost, hwloc).
        COMMANDS=$(ninja -C build/smoke/build -t commands hello_wrap)
        CXX=$(grep '^CMAKE_CXX_COMPILER:' \
          build/smoke/build/CMakeCache.txt | head -n1 | cut -d= -f2)
        STDFLAG=$(printf '%s\n' "$COMMANDS" | tr ' ' '\n' \
          | grep -E '^-std=' | head -n1)
        LINK_LINE=$(printf '%s\n' "$COMMANDS" | tail -n1)
        EXTRA=$(printf '%s\n' "$LINK_LINE" | tr ' ' '\n' \
          | grep -E '^-l|^-L|^-Wl,|^-pthread|\.a$|\.so(\.[0-9]+)*$' \
          | grep -v 'hello_wrap' \
          | tr '\n' ' ')
        : "${CXX:=g++}"
        : "${STDFLAG:=-std=c++20}"

        "$CXX" ${STDFLAG} -O2 -o build/smoke/raw_wrap \
          build/smoke/raw_wrap.cpp \
          -isystem "$PREFIX/include" \
          -DHPX_APPLICATION_EXPORTS \
          ${EXTRA}

        build/smoke/raw_wrap --hpx:threads=2
