name: macOS CI (Debug) with Boost Fetch

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
          brew install --overwrite python-tk && \
          brew install --overwrite hwloc gperftools ninja && \
          brew upgrade cmake
    - name: Configure
      shell: bash
      run: |
          cmake \
              -H. \
              -Bbuild \
              -GNinja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DHPX_WITH_FETCH_ASIO=ON \
              -DHPX_WITH_FETCH_BOOST=ON \
              -DHPX_WITH_EXAMPLES=ON \
              -DHPX_WITH_TESTS=ON \
              -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=2 \
              -DHPX_WITH_CHECK_MODULE_DEPENDENCIES=On \
              -DHPX_WITH_TESTS_EXTERNAL_BUILD=Off
    - name: Build
      shell: bash
      run: |
          cmake --build build --target all
          cmake --build build --target examples
    - name: Test
      shell: bash
      run: |
          cd build
          ctest --output-on-failure --tests-regex tests.examples --exclude-regex "tests.examples.quickstart.1d_wave_equation|tests.examples.transpose.transpose_block_numa"
