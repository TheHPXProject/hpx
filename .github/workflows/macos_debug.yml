name: macOS (Debug)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: AppleClang
    uses: ./.github/workflows/sharded-build-and-test.yml
    with:
      runs-on: macos-latest
      setup: |
        brew install --overwrite python-tk && \
        brew install --overwrite boost hwloc gperftools ninja && \
        brew upgrade cmake
      configure: |
        cmake \
            -H. \
            -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHPX_WITH_FETCH_ASIO=ON \
            -DHPX_WITH_ASIO_TAG=asio-1-34-2 \
            -DHPX_WITH_EXAMPLES=ON \
            -DHPX_WITH_TESTS=ON \
            -DHPX_WITH_SUPERVISION=ON \
            -DHPX_WITH_TESTS_MAX_THREADS_PER_LOCALITY=3 \
            -DHPX_WITH_VERIFY_LOCKS=OFF \
            -DHPX_WITH_VERIFY_LOCKS_BACKTRACE=OFF \
            -DHPX_WITH_CHECK_MODULE_DEPENDENCIES=ON \
            -DHPX_WITH_CONTRACTS=ON \
            -DHPX_WITH_CONTRACTS_MODE=OBSERVE \
            -DHPX_WITH_TASK_SIZE_DEFAULT_PARAMETERS=ON \
            -DHPX_WITH_TESTS_COMMAND_LINE=--hpx:queuing=local-priority-fifo-double
      base-targets: hpx_core core components
      # macOS runners are few, keep the number of parallel jobs low
      shards: 5
      exclude-regex-files: .github/workflows/macos.exclude.regex
      # as before: the default timeout of ctest
      ctest-timeout: "1500"
